name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Black
        run: black --check .
        
      - name: Run isort
        run: isort --check-only .
        
      - name: Run Flake8
        run: flake8 .
        
      - name: Run Mypy
        run: mypy .
        
      - name: Run Pytest
        run: pytest -v
